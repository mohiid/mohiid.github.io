<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <title>Mohid Choudhry</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f5f7;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid #e1e5eb;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1.5rem 4rem rgb(23 32 51 / 8%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      letter-spacing: -0.06em;
      line-height: 1.05;
    }

    p {
      margin: 1.25rem 0 0;
      color: #596579;
      font-size: clamp(1.125rem, 3vw, 1.35rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mohid Choudhry</h1>
    <p>I am a 20 year old soccer athlete.</p>
  </main>
</body>
</html>
